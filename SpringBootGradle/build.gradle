/*
 * This file was generated by the Gradle 'init' task.
 *
 * This is a general purpose Gradle build.
 * Learn more about Gradle by exploring our samples at https://docs.gradle.org/7.6.4/samples
 */

group = 'exam.springboot' //group은 이 프로젝트는 어떤 프로젝트인가를 표기하는 용도정도로만 사용. 사용하는데는 아무 지장없음.
version = '0.0.1-SNAPSHOT' //소스의 버전 임의대로 설정하면됨. 없어도 상관없음

sourceCompatibility = '1.8' //JAVA 소스코드 컴파일 버전
 
plugins {
	id 'java' //JAVA 프로젝트 기능.
	id 'org.springframework.boot' version '2.7.18' // boot는 애플리케이션을 gradle로 빌드하고 실행하는 기능. EX) bootRun, bootJar, bootWar
	id 'io.spring.dependency-management' version '1.0.15.RELEASE' //dependency의 버전을 관리하는 역활. spring boot 2.7에서 사용하는 라이브러리의 버전을 관리해주는 역활.
}

//여기 repositories는 앞으로 추가할 일반 라이브러리르를 어디서 받을지 지정.
repositories {
	mavenCentral()
}

dependencies {
	//io.spring.dependency-management를 사용했기에 버전 명시를 안해도 됨. spring boot 2.7.18이 관리하는 버전을 자동으로 사용함.
    implementation 'org.springframework.boot:spring-boot-starter-web'
}